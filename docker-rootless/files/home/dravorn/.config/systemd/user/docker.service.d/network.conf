; !DOCKER_ROOTLESS!
; In Docker rootless mode, containers see the gateway IP (often 10.0.2.2 or 172.x.x.x) instead of the external source IP 
; because of the default RootlessKit port driver. This driver uses a user-level proxy to forward traffic,
; which performs Source Network Address Translation (SNAT) and effectively "hides" the original client IP.
; Install (Pack a Subtle Tap Abstraction) network and port driver:
; sudo apt install passt
[Service]
Environment="DOCKERD_ROOTLESS_ROOTLESSKIT_NET=pasta"
Environment="DOCKERD_ROOTLESS_ROOTLESSKIT_PORT_DRIVER=implicit"
; When you use pasta, RootlessKit clones only the host's primary, default interface IP into the unprivileged network namespace
; If 10.22.0.3 is a secondary IP, an alias, or bound to a different interface on your machine,
; Rootless Docker literally cannot see it and cannot bind to it.
; To fix this, you must explicitly tell RootlessKit to mirror and copy your specific interface configuration into the user namespace.
; Environment="DOCKERD_ROOTLESS_ROOTLESSKIT_PASTA_INTERFACE=eno1"
; Enable IPv6
Environment="DOCKERD_ROOTLESS_ROOTLESSKIT_FLAGS=--ipv6"